<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />
    <link rel="icon" type="image/png" href="assets/branding/trace-platform.png" />
    <link rel="apple-touch-icon" href="assets/branding/trace-platform.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#10243f" />
    <meta property="og:site_name" content="Dallogix Trace" />
    <meta property="og:title" content="Dallogix Trace" />
    <meta property="og:image" content="/assets/branding/trace-platform.png" />
    <title>Acesso ao sistema • Dallogix Trace</title>
    <link rel="stylesheet" href="css/styles.css?v=27" />
    <link rel="stylesheet" href="css/light-theme.css?v=202609150300" />
    <link rel="stylesheet" href="css/auth.css?v=202609160002" />
      <link rel="stylesheet" href="css/responsive.css?v=202609161715" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <div class="brand login-brand">
          <img src="assets/branding/trace-platform.png" alt="TRACE PLATFORM" />
        </div>
        <h1>Dallogix Trace</h1>
        <p class="login-description">
          Acesse a operação local e acompanhe os carregamentos em tempo real.
        </p>
        <div id="login-error" role="alert" aria-live="assertive" tabindex="-1"></div>
        <form id="login-form" method="post" action="/api/login.php">
          <label
            >E-mail<input
              name="email"
              type="email"
              value=""
              autocomplete="username"
              required
          /></label>
          <label
            >Senha<input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
          /></label>
          <button class="button primary login-button" type="submit">
            Entrar no sistema
          </button>
        </form>
      </section>
    </main>
    <script data-cfasync="false" type="module" src="js/aplicacao.js?v=202609161715" data-page="login"></script>
  </body>
</html>
