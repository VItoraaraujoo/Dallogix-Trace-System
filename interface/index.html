<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso ao sistema • Dallogix Trace</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/light-theme.css?v=5" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="login-page">
      <button
        class="theme-toggle login-theme-toggle"
        data-action="toggle-theme"
        type="button"
        aria-label="Ativar modo noturno"
        aria-pressed="false"
      >
        <span class="theme-icon" aria-hidden="true">☾</span>
        <span class="theme-label">Modo noturno</span>
      </button>
      <section class="login-card">
        <div class="brand login-brand">
          <div class="login-brands" aria-label="Trace Platform e Dallogix">
            <img src="assets/trace-platform.png" alt="Trace Platform" />
            <img src="assets/dallogix-marca.png" alt="Dallogix" />
          </div>
        </div>
        <button class="theme-toggle login-theme-toggle" data-action="toggle-theme" type="button" aria-label="Ativar modo noturno"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Modo noturno</span></button>
        <h1>Dallogix Trace</h1>
        <p class="login-description">
          Acesse a operação local e acompanhe os carregamentos em tempo real.
        </p>
        <div id="login-error"></div>
        <form id="login-form" method="post" action="index.html">
          <label
            >E-mail<input
              name="email"
              type="email"
              value="admin@dallogix.local"
              autocomplete="username"
              required
          /></label>
          <label
            >Senha<input
              name="password"
              type="password"
              autocomplete="current-password"
              required
          /></label>
          <button class="button primary login-button" type="submit">
            Entrar no sistema
          </button>
        </form>
      </section>
    </main>
    <script type="module" src="js/aplicacao.js?v=27" data-page="login"></script>
  </body>
</html>
