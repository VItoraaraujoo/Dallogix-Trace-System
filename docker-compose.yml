services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      php:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "${PHP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/var/www/frontend:ro
      - ./backend:/var/www/backend:ro

  php:
    build:
      context: ./docker/php
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-trace_local}
      DB_USER: ${MYSQL_USER:-trace}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      SYNC_REMOTE_URL: ${SYNC_REMOTE_URL:-}
      CAMERA_INTERNAL_TOKEN: ${CAMERA_INTERNAL_TOKEN:-change-me-camera-token}
    volumes:
      - ./backend:/var/www/backend
      - ./storage:/var/www/storage
      - ./scripts:/var/www/scripts:ro

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trace_local}
      MYSQL_USER: ${MYSQL_USER:-trace}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  node-red:
    image: nodered/node-red:3.1.9
    ports:
      - "${NODE_RED_PORT:-1880}:1880"
    volumes:
      - node_red_data:/data
      - ./integration/node-red:/seed:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:1880"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  node_red_data:
