services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      php:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./interface:/var/www/interface:ro
      - ./servidor:/var/www/servidor:ro

  php:
    build:
      context: ./docker/php
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-trace_local}
      DB_USER: ${MYSQL_USER:-trace}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      SYNC_REMOTE_URL: ${SYNC_REMOTE_URL:-}
      SYNC_REMOTE_TOKEN: ${SYNC_REMOTE_TOKEN:-}
      CAMERA_INTERNAL_TOKEN: ${CAMERA_INTERNAL_TOKEN:-change-me-camera-token}
      PLC_INTERNAL_TOKEN: ${PLC_INTERNAL_TOKEN:-change-me-plc-token}
      LOGIN_EMAIL_DOMAIN: ${LOGIN_EMAIL_DOMAIN:-dallogix.local}
    volumes:
      - ./servidor:/var/www/servidor
      - ./armazenamento:/var/www/armazenamento
      - ./scripts:/var/www/scripts:ro

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trace_local}
      MYSQL_USER: ${MYSQL_USER:-trace}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  node-red:
    image: nodered/node-red:3.1.9
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NODE_RED_PORT:-1880}:1880"
    environment:
      TRACE_API_URL: ${TRACE_API_URL:-http://nginx}
      PLC_INTERNAL_TOKEN: ${PLC_INTERNAL_TOKEN:-change-me-plc-token}
      MODBUS_VIRTUAL_HOST: ${MODBUS_VIRTUAL_HOST:-modbus-virtual}
      MODBUS_VIRTUAL_PORT: ${MODBUS_VIRTUAL_PORT:-1502}
    volumes:
      - node_red_data:/data
      - ./integracoes/node-red:/seed:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:1880"]
      interval: 10s
      timeout: 5s
      retries: 10

  modbus-virtual:
    build:
      context: ./integracoes/modbus-virtual
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MODBUS_VIRTUAL_PORT:-1502}:1502"
    environment:
      MODBUS_PORT: 1502
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 1502), 1); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 10

  image-retention:
    build:
      context: ./docker/php
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-trace_local}
      DB_USER: ${MYSQL_USER:-trace}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      IMAGE_RETENTION_DAYS: ${IMAGE_RETENTION_DAYS:-30}
    command:
      [
        "sh",
        "-c",
        "while true; do php /var/www/scripts/prune_images.php; sleep 86400; done",
      ]
    restart: unless-stopped
    volumes:
      - ./armazenamento:/var/www/armazenamento
      - ./scripts:/var/www/scripts:ro

volumes:
  mysql_data:
  node_red_data:
