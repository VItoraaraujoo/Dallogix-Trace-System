server {
    listen 80;
    server_name _;
    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/(.+\.php)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/$1;
        fastcgi_pass php:9000;
    }
}
