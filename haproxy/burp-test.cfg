global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend trace_burp_tls
    bind :8443
    default_backend trace_nginx_tls

backend trace_nginx_tls
    option tcp-check
    server nginx nginx:443 check inter 5s fall 3 rise 2 resolvers docker_dns init-addr libc,none

resolvers docker_dns
    nameserver dockerdns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s
    hold nx 3s
