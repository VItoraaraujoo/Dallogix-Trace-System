name: Quality gate (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dallogix-trace-quality-manual
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Configure Node.js for industrial tests
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Run PHPUnit
        run: composer test
      - name: Run PHPStan
        run: composer analyse -- --no-progress
      - name: Validate project files
        run: bash testes/qualidade.sh
      - name: Validate Modbus and gateway integration
        run: |
          node --test testes/gateway-clp.mjs testes/operacoes-offline.mjs testes/camera-upload-http.mjs
          python3 testes/modbus-transporte.py
          php testes/api-conectividade-isolada.php online
          php testes/api-conectividade-isolada.php stale
          php testes/api-conectividade-isolada.php missing
          php testes/api-sensor-idempotencia-isolada.php same
          php testes/api-sensor-idempotencia-isolada.php foreign
      - name: Scan for high-risk secrets
        run: bash scripts/security_scan.sh
