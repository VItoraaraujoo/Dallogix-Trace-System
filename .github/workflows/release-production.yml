name: Publicar versão de produção

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag SemVer já incorporada à master, por exemplo v1.2.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dallogix-trace-production-release
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - name: Checkout da tag solicitada
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Preparar .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador da release
        shell: powershell
        run: .\implantacao\windows\Build-TraceSetup.ps1

      - name: Guardar instalador para publicação conjunta
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: trace-windows-installer
          path: implantacao/windows/Output/TraceSetup.exe
          if-no-files-found: error

      - name: Guardar aplicativo Windows para o pacote de atualização
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: trace-windows-runtime
          path: desktop/DallogixTrace/bin/Release/net8.0-windows/win-x64/publish/*
          if-no-files-found: error

  release:
    needs: windows-installer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment: production-release
    steps:
      - name: Checkout da tag solicitada
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Validar a tag e o commit de produção
        id: release
        env:
          VERSION: ${{ inputs.release_tag }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || {
            echo "Execute este workflow a partir da branch master." >&2
            exit 1
          }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Informe uma tag no formato vN.N.N." >&2
            exit 1
          }
          git fetch origin master --no-tags
          commit="$(git rev-parse "$VERSION^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          [[ "$commit" == "$checked_out_commit" ]] || {
            echo "A tag selecionada não aponta para o commit carregado." >&2
            exit 1
          }
          git merge-base --is-ancestor "$commit" origin/master || {
            echo "A versão precisa apontar para um commit já incorporado à master." >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Configurar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validar manifesto Composer
        run: composer validate --no-check-publish

      - name: Executar PHPUnit
        run: composer test

      - name: Executar PHPStan
        run: composer analyse -- --no-progress

      - name: Configurar Node.js dos testes industriais
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validar integração industrial isolada
        run: |
          node --test testes/gateway-clp.mjs testes/operacoes-offline.mjs testes/camera-upload-http.mjs testes/estado-fisico.mjs testes/produtos-romaneio.mjs
          python3 testes/modbus-transporte.py
          php testes/api-conectividade-isolada.php online
          php testes/api-conectividade-isolada.php stale
          php testes/api-conectividade-isolada.php missing
          php testes/api-sensor-idempotencia-isolada.php same
          php testes/api-sensor-idempotencia-isolada.php foreign

      - name: Validar código e segredos
        run: |
          bash testes/qualidade.sh
          bash scripts/security_scan.sh

      - name: Obter aplicativo Windows da mesma tag
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: trace-windows-runtime
          path: dist/windows-runtime

      - name: Montar pacote imutável
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          mkdir -p dist/stage
          git archive --format=tar "$COMMIT" -- . \
            ':(exclude)testes/**' \
            ':(exclude)documentacao/testes/**' \
            ':(exclude)documentacao/auditorias/**' \
            ':(exclude)banco-de-dados/seeds/**' \
            ':(exclude)documentacao/operacao/teste-producao-local.md' \
            ':(exclude)documentacao/operacao/simulador-clp.md' \
            ':(exclude)documentacao/operacao/plano-entrega-producao.md' \
            ':(exclude)documentacao/operacao/plano-execucao-consolidado.md' \
            ':(exclude)documentacao/arquitetura/plano-ajuste-geral.md' \
            ':(exclude)documentacao/historico-projeto-dallogix-trace.md' \
            ':(exclude)documentacao/prompt-mestre-dallogix-trace.md' \
            ':(exclude)documentacao/revisao-codigo-desempenho.md' \
            ':(exclude)scripts/simulate_clp.sh' | tar -xf - -C dist/stage
          php scripts/version_assets.php "$COMMIT" dist/stage
          cp -a dist/windows-runtime/. dist/stage/
          printf '%s\n' "$VERSION" > dist/stage/trace-build-version.txt
          printf '%s\n' "$COMMIT" > dist/stage/trace-build-commit.txt
          tar -czf "dist/trace-${VERSION}.tar.gz" -C dist/stage .
          sha256sum "dist/trace-${VERSION}.tar.gz" | awk '{print $1}' > dist/sha256.txt

      - name: Gerar SBOM do release
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/stage
          artifact-name: dallogix-trace-sbom.spdx.json
          output-file: dist/dallogix-trace-sbom.spdx.json
          format: spdx-json

      - name: Criar manifesto assinado
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          test -n "$UPDATE_SIGNING_PRIVATE_KEY" || {
            echo "Configure UPDATE_SIGNING_PRIVATE_KEY no ambiente production-release." >&2
            exit 1
          }
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$UPDATE_SIGNING_PRIVATE_KEY" > "$key_file"
          artifact_url="https://github.com/${REPOSITORY}/releases/download/${VERSION}/trace-${VERSION}.tar.gz"
          sha256="$(cat dist/sha256.txt)"
          printf '%s\n%s\n%s\n' "$VERSION" "$artifact_url" "$sha256" > dist/payload.txt
          openssl dgst -sha256 -sign "$key_file" -out dist/signature.bin dist/payload.txt
          signature="$(base64 --wrap=0 dist/signature.bin)"
          python3 - "$VERSION" "$COMMIT" "$artifact_url" "$sha256" "$signature" > dist/manifest.json <<'PY'
          import json
          import sys

          version, commit, artifact_url, sha256, signature = sys.argv[1:]
          print(json.dumps({
              "channel": "stable",
              "version": version,
              "commit": commit,
              "artifact_url": artifact_url,
              "sha256": sha256,
              "signature": signature,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Obter instalador Windows da mesma tag
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: trace-windows-installer
          path: dist

      - name: Atualizar o Central pelo atualizador protegido
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CENTRAL_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CENTRAL_SERVER_SSH_KNOWN_HOSTS }}
          SERVER_HOST: ${{ vars.CENTRAL_SERVER_SSH_HOST }}
          SERVER_USER: ${{ vars.CENTRAL_SERVER_SSH_USER }}
          SERVER_PORT: ${{ vars.CENTRAL_SERVER_SSH_PORT }}
          SERVER_PATH: ${{ vars.CENTRAL_SERVER_PATH }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          : "${SERVER_HOST:?Configure CENTRAL_SERVER_SSH_HOST no ambiente production-release.}"
          : "${SERVER_USER:?Configure CENTRAL_SERVER_SSH_USER no ambiente production-release.}"
          : "${SERVER_PATH:?Configure CENTRAL_SERVER_PATH no ambiente production-release.}"
          : "${SSH_PRIVATE_KEY:?Configure CENTRAL_SERVER_SSH_KEY no ambiente production-release.}"
          : "${SSH_KNOWN_HOSTS:?Configure CENTRAL_SERVER_SSH_KNOWN_HOSTS no ambiente production-release.}"
          SERVER_PORT="${SERVER_PORT:-22}"
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Host SSH inválido." >&2; exit 1; }
          [[ "$SERVER_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "Usuário SSH inválido." >&2; exit 1; }
          [[ "$SERVER_PORT" =~ ^[0-9]{1,5}$ ]] && (( SERVER_PORT >= 1 && SERVER_PORT <= 65535 )) || {
            echo "Porta SSH inválida." >&2; exit 1;
          }
          [[ "$SERVER_PATH" =~ ^/[A-Za-z0-9_./-]+$ && "$SERVER_PATH" != "/" && "$SERVER_PATH" != *"/../"* && "$SERVER_PATH" != */.. ]] || {
            echo "CENTRAL_SERVER_PATH precisa ser um diretório absoluto seguro." >&2; exit 1;
          }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          known_host="$SERVER_HOST"
          if [[ "$SERVER_PORT" != "22" ]]; then known_host="[$SERVER_HOST]:$SERVER_PORT"; fi
          ssh-keygen -F "$known_host" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "A chave SSH fixada não corresponde ao host e à porta configurados." >&2; exit 1;
          }
          ssh_options=(-p "$SERVER_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          remote_stage="/tmp/dallogix-trace-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote="$SERVER_USER@$SERVER_HOST"
          cleanup_remote_stage() {
            ssh "${ssh_options[@]}" "$remote" "rm -rf -- '$remote_stage'" >/dev/null 2>&1 || true
          }
          trap cleanup_remote_stage EXIT
          ssh "${ssh_options[@]}" "$remote" "mkdir -m 700 -p '$remote_stage'"
          scp -P "$SERVER_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            dist/manifest.json "dist/trace-${VERSION}.tar.gz" scripts/update_trace.sh "$remote:$remote_stage/"
          ssh "${ssh_options[@]}" "$remote" bash -s -- "$SERVER_PATH" "$remote_stage" "$VERSION" "$COMMIT" <<'REMOTE'
          set -euo pipefail
          app_root="$1"
          stage="$2"
          version="$3"
          commit="$4"
          trap 'rm -rf -- "$stage"' EXIT
          [[ -r "$app_root/.env" ]] || { echo "Arquivo .env do Central não está acessível; atualização cancelada." >&2; exit 1; }
          . "$app_root/.env"
          health_port="${WEB_PORT:-8080}"
          [[ "$health_port" =~ ^[0-9]{1,5}$ ]] && (( health_port >= 1 && health_port <= 65535 )) || {
            echo "WEB_PORT do Central é inválida; atualização cancelada." >&2; exit 1;
          }
          health_url="http://127.0.0.1:${health_port}/api/health.php"
          curl --fail --silent --show-error --max-time 15 "$health_url" -o "$stage/health-before.json"
          python3 - "$stage/health-before.json" <<'PY'
          import json
          import pathlib
          import sys

          health = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if health.get("status") != "ok" or health.get("installation_mode") != "central":
              raise SystemExit("O Central não está saudável ou não está identificado como instalação Central; atualização cancelada.")
          PY
          # O timer systemd e o deploy usam a mesma conta administrativa para
          # preservar a propriedade do estado, dos backups e dos marcadores.
          sudo -n true || {
            echo "A conta de publicação precisa da execução administrativa não interativa configurada para o atualizador." >&2
            exit 23
          }
          run_updater() {
            sudo -n env \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              TRACE_UPDATE_ROOT="$app_root" \
              TRACE_UPDATE_MANIFEST_FILE="$stage/manifest.json" \
              TRACE_UPDATE_ARTIFACT_FILE="$stage/trace-$version.tar.gz" \
              TRACE_UPDATE_EXPECT_VERSION="$version" \
              TRACE_UPDATE_EXPECT_COMMIT="$commit" \
              bash "$stage/update_trace.sh"
          }
          wait_deadline=$((SECONDS + 1800))
          lock_diagnostics_done=0
          while true; do
            if run_updater; then
              break
            else
              updater_status=$?
            fi
            if [[ "$updater_status" != "9" && "$updater_status" != "14" ]]; then
              exit "$updater_status"
            fi
            if [[ "$updater_status" == "9" && "$lock_diagnostics_done" == "0" ]]; then
              lock_diagnostics_done=1
              diagnostics_status=0
              if diagnostic_output="$(bash -s -- "$app_root" <<'REMOTE_DIAGNOSTICS'
          set -euo pipefail
          app_root="$1"
          lock_dir="$app_root/armazenamento/updates/.install.lock"
          maintenance_file="$app_root/armazenamento/.maintenance"
          if [[ -d "$lock_dir" ]]; then
            stat -c 'install_lock=present modified=%y' -- "$lock_dir"
          else
            echo "install_lock=absent"
          fi
          if [[ -e "$maintenance_file" ]]; then
            stat -c 'maintenance=present modified=%y' -- "$maintenance_file"
          else
            echo "maintenance=absent"
          fi
          systemctl show --no-pager -p ActiveState -p SubState -p MainPID -p ExecMainStartTimestamp -p TimeoutStartUSec dallogix-trace-sync.service
          service_state="$(systemctl show --property=ActiveState --value dallogix-trace-sync.service)"
          updater_processes="$(ps -eo pid=,etimes=,stat=,args= | awk 'index($0, "update_" "trace.sh") {print "pid=" $1 " elapsed_s=" $2 " state=" $3}')"
          if [[ -n "$updater_processes" ]]; then
            printf 'updater_processes:\n%s\n' "$updater_processes"
          else
            echo "updater_processes=none_visible"
          fi
          sudo -n journalctl -u dallogix-trace-sync.service -n 20 --no-pager -o cat
          if [[ -d "$lock_dir" && -z "$updater_processes" && "$service_state" != "active" && "$service_state" != "activating" ]]; then
            echo "Trava presente sem processo atualizador visível nem serviço systemd ativo; remoção automática não permitida." >&2
            exit 42
          fi
          REMOTE_DIAGNOSTICS
          )"; then
                printf '%s\n' "$diagnostic_output"
              else
                diagnostics_status=$?
                printf '%s\n' "$diagnostic_output" >&2
                if [[ "$diagnostics_status" == "42" ]]; then
                  echo "Trava de atualização suspeita; interrompendo sem removê-la." >&2
                else
                  echo "Não foi possível concluir o diagnóstico remoto; atualização cancelada por segurança." >&2
                fi
                exit "$diagnostics_status"
              fi
            fi
            remaining=$((wait_deadline - SECONDS))
            if (( remaining <= 0 )); then
              echo "O Central continuou ocupado por 30 minutos; a versão não foi publicada." >&2
              exit "$updater_status"
            fi
            wait_seconds=30
            if (( remaining < wait_seconds )); then wait_seconds="$remaining"; fi
            echo "O atualizador protegido informou que o Central está ocupado (código $updater_status); nova tentativa em ${wait_seconds}s."
            sleep "$wait_seconds"
          done
          curl --fail --silent --show-error --max-time 30 "$health_url" -o "$stage/health-after.json"
          python3 - "$stage/health-after.json" "$version" "$commit" <<'PY'
          import json
          import pathlib
          import sys

          health = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = (sys.argv[2], sys.argv[3])
          actual = (health.get("version"), health.get("commit"))
          if health.get("status") != "ok" or health.get("installation_mode") != "central" or actual != expected:
              raise SystemExit(f"Central não serve a release solicitada: esperado {expected}, recebido {actual}.")
          print(f"Central confirmado na versão {expected[0]} e no commit {expected[1]}.")
          PY
          sudo -n bash "$app_root/scripts/install_backup_timer.sh" "$app_root"
          sudo -n systemctl is-enabled --quiet dallogix-trace-backup.timer
          sudo -n systemctl is-active --quiet dallogix-trace-backup.timer
          echo "Timer diário de backup confirmado como habilitado e ativo."
          REMOTE

      - name: Publicar a versão liberada pelo Central
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          gh release create "$VERSION" \
            "dist/trace-${VERSION}.tar.gz" \
            dist/manifest.json \
            dist/TraceSetup.exe \
            dist/dallogix-trace-sbom.spdx.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --verify-tag \
            --title "Dallogix Trace ${VERSION}" \
            --generate-notes
