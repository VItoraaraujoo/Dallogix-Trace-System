name: Security checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  quality-and-secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate project files
        run: bash testes/qualidade.sh
      - name: Scan for high-risk secrets
        run: bash scripts/security_scan.sh

  codeql:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          # CodeQL não possui extrator PHP oficial; o job php-quality abaixo
          # cobre o código PHP com Composer, PHPUnit e PHPStan.
          languages: javascript
      - name: Analyze JavaScript
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  php-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Run PHPUnit
        run: composer test
      - name: Run PHPStan
        run: composer analyse -- --no-progress
      - name: Audit PHP dependencies
        # O projeto só possui dependências de desenvolvimento; --no-dev
        # deixava o conjunto auditado vazio e fazia o Composer retornar 1.
        run: composer audit --no-interaction

  dependencies-and-config:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          artifact-name: dallogix-trace-sbom.spdx.json
          output-file: dallogix-trace-sbom.spdx.json
          format: spdx-json

  secrets-history:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (Node.js 24)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
