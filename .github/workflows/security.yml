name: Security checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  quality-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate project files
        run: bash testes/qualidade.sh
      - name: Scan for high-risk secrets
        run: bash scripts/security_scan.sh

  codeql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # CodeQL não possui extrator PHP oficial; o job php-quality abaixo
          # cobre o código PHP com Composer, PHPUnit e PHPStan.
          languages: javascript
      - name: Analyze JavaScript
        uses: github/codeql-action/analyze@v4

  php-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Run PHPUnit
        run: composer test
      - name: Run PHPStan
        run: composer analyse -- --no-progress
      - name: Audit PHP dependencies
        run: composer audit --no-interaction --no-dev

  dependencies-and-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          artifact-name: dallogix-trace-sbom.spdx.json
          output-file: dallogix-trace-sbom.spdx.json
          format: spdx-json

  secrets-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
