name: Trace quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
          extensions: pdo_sqlite, sqlite3
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install PHP test tools
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Run PHP unit tests
        run: composer test
      - name: Run PHP static analysis
        run: composer analyse -- --no-progress
      - name: Validate Trace
        run: |
          bash testes/qualidade.sh
          bash testes/etapa29.sh
          node testes/navegacao-isolada.mjs
          node --test testes/gateway-clp.mjs testes/operacoes-offline.mjs testes/camera-upload-http.mjs testes/estado-fisico.mjs testes/clp-provisorio-simulacao.mjs testes/clp-provisorio-ss2.mjs
          python3 testes/modbus-transporte.py
          php testes/api-permissoes-isoladas.php admin-target
          php testes/api-permissoes-isoladas.php foreign-action
          php testes/api-permissoes-isoladas.php created-id
          php testes/api-permissoes-isoladas.php sync-reserved
          php testes/api-permissoes-isoladas.php sync-operator
          php testes/api-conectividade-isolada.php online
          php testes/api-conectividade-isolada.php stale
          php testes/api-conectividade-isolada.php missing
          php testes/api-sensor-idempotencia-isolada.php same
          php testes/api-sensor-idempotencia-isolada.php foreign

  mysql-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Run clean MySQL migrations, HTTPS application, and backup regression
        env:
          TRACE_PRODUCTION_TEST_PROJECT: trace-pr-${{ github.run_id }}-${{ github.run_attempt }}
          TRACE_PRODUCTION_TEST_STATE_DIR: ${{ runner.temp }}/trace-pr-${{ github.run_id }}-${{ github.run_attempt }}
          TRACE_PRODUCTION_TEST_ENV_FILE: ${{ runner.temp }}/trace-pr-${{ github.run_id }}-${{ github.run_attempt }}/.env.production-test
          TRACE_TEST_STORAGE_PATH: ${{ runner.temp }}/trace-pr-${{ github.run_id }}-${{ github.run_attempt }}/storage
          TRACE_TEST_HTTPS_PORT: '18443'
        run: |
          python3 scripts/production_test.py
          python3 testes/production_smoke.py
          python3 testes/production_backup.py
      - name: Remove this run's isolated containers and database volume
        if: always()
        env:
          TRACE_PRODUCTION_TEST_PROJECT: trace-pr-${{ github.run_id }}-${{ github.run_attempt }}
          TRACE_PRODUCTION_TEST_STATE_DIR: ${{ runner.temp }}/trace-pr-${{ github.run_id }}-${{ github.run_attempt }}
          TRACE_PRODUCTION_TEST_ENV_FILE: ${{ runner.temp }}/trace-pr-${{ github.run_id }}-${{ github.run_attempt }}/.env.production-test
        run: |
          if [ -f "$TRACE_PRODUCTION_TEST_ENV_FILE" ]; then
            docker compose \
              --project-name "$TRACE_PRODUCTION_TEST_PROJECT" \
              --env-file "$TRACE_PRODUCTION_TEST_ENV_FILE" \
              -f docker-compose.production-test.yml \
              down --volumes --remove-orphans
          fi
          if [ -d "$TRACE_PRODUCTION_TEST_STATE_DIR" ]; then
            rm -r -- "$TRACE_PRODUCTION_TEST_STATE_DIR"
          fi
