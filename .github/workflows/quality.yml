name: Trace quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Compilar o aplicativo do PC industrial
        run: dotnet build desktop/DallogixTrace/DallogixTrace.csproj --configuration Release

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
          extensions: pdo_sqlite, sqlite3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install PHP test tools
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Run PHP unit tests
        run: composer test
      - name: Run PHP static analysis
        run: composer analyse -- --no-progress
      - name: Validate Trace
        run: |
          bash testes/qualidade.sh
          bash testes/etapa29.sh
          node testes/navegacao-isolada.mjs
          node --test testes/gateway-clp.mjs testes/operacoes-offline.mjs testes/keyence-worker.mjs testes/estado-fisico.mjs testes/clp-provisorio-simulacao.mjs testes/clp-provisorio-ss2.mjs testes/produtos-romaneio.mjs
          python3 testes/modbus-transporte.py
          php testes/api-permissoes-isoladas.php admin-target
          php testes/api-permissoes-isoladas.php foreign-action
          php testes/api-permissoes-isoladas.php created-id
          php testes/api-permissoes-isoladas.php sync-reserved
          php testes/api-permissoes-isoladas.php sync-operator
          php testes/api-conectividade-isolada.php online
          php testes/api-conectividade-isolada.php stale
          php testes/api-conectividade-isolada.php missing
          php testes/api-sensor-idempotencia-isolada.php same
          php testes/api-sensor-idempotencia-isolada.php foreign

  mysql-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run clean MySQL migrations, HTTPS application, operation, and backup regression
        env:
          TRACE_PRODUCTION_TEST_PROJECT: trace-pr-${{ github.run_id }}-${{ github.run_attempt }}
          TRACE_PRODUCTION_TEST_STATE_DIR: ${{ runner.temp }}/trace-pr-${{ github.run_id }}-${{ github.run_attempt }}
          TRACE_PRODUCTION_TEST_ENV_FILE: ${{ runner.temp }}/trace-pr-${{ github.run_id }}-${{ github.run_attempt }}/.env.production-test
          TRACE_TEST_STORAGE_PATH: ${{ runner.temp }}/trace-pr-${{ github.run_id }}-${{ github.run_attempt }}/storage
          TRACE_TEST_HTTPS_PORT: '18443'
        run: |
          python3 scripts/production_test.py
          python3 testes/production_integrity.py
          python3 testes/production_smoke.py
          while IFS= read -r line; do
            if [[ -z "$line" || "${line:0:1}" == "#" ]]; then continue; fi
            export "$line"
          done < "$TRACE_PRODUCTION_TEST_ENV_FILE"
          export COMPOSE_FILE="$GITHUB_WORKSPACE/docker-compose.production-test.yml"
          export COMPOSE_PROJECT_NAME="$TRACE_PRODUCTION_TEST_PROJECT"
          export TRACE_BASE_URL="https://localhost:$TRACE_TEST_HTTPS_PORT"
          export TRACE_REGRESSION_DISPOSABLE=1
          export CURL_CA_BUNDLE="$TRACE_PRODUCTION_TEST_STATE_DIR/tls/fullchain.pem"
          export TRACE_TEST_ADMIN_PASSWORD="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["admin@dallogix.local"])' "$TRACE_PRODUCTION_TEST_STATE_DIR/acessos.json")"
          bash testes/etapa38.sh
          python3 testes/production_backup.py
      - name: Remove this run's isolated containers and database volume
        if: always()
        env:
          TRACE_PRODUCTION_TEST_PROJECT: trace-pr-${{ github.run_id }}-${{ github.run_attempt }}
          TRACE_PRODUCTION_TEST_STATE_DIR: ${{ runner.temp }}/trace-pr-${{ github.run_id }}-${{ github.run_attempt }}
          TRACE_PRODUCTION_TEST_ENV_FILE: ${{ runner.temp }}/trace-pr-${{ github.run_id }}-${{ github.run_attempt }}/.env.production-test
        run: |
          if [ -f "$TRACE_PRODUCTION_TEST_ENV_FILE" ]; then
            docker compose \
              --project-name "$TRACE_PRODUCTION_TEST_PROJECT" \
              --env-file "$TRACE_PRODUCTION_TEST_ENV_FILE" \
              -f docker-compose.production-test.yml \
              down --volumes --remove-orphans
          fi
          if [ -d "$TRACE_PRODUCTION_TEST_STATE_DIR" ]; then
            rm -r -- "$TRACE_PRODUCTION_TEST_STATE_DIR"
          fi
